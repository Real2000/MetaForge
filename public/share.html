<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能体分享</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>A</text></svg>">
  <style>
    body { background: #f5f7fb; margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .share-wrap { max-width: 860px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; }
    .share-head { background: #fff; border: 1px solid #e5e9f2; border-radius: 14px; padding: 18px 22px; display: flex; align-items: center; gap: 14px; }
    .share-head .ava { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .share-head h1 { font-size: 17px; margin: 0 0 4px; }
    .share-head p { margin: 0; font-size: 13px; color: #8a94a6; }
    .share-body { flex: 1; background: #fff; border: 1px solid #e5e9f2; border-radius: 14px; margin-top: 14px; display: flex; flex-direction: column; overflow: hidden; }
    .msgs { flex: 1; overflow-y: auto; padding: 20px; }
    .msg { display: flex; gap: 10px; margin-bottom: 16px; }
    .msg .ava2 { width: 32px; height: 32px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .msg.bot .ava2 { background: #eef2ff; color: #2563eb; }
    .msg.user { flex-direction: row-reverse; }
    .msg.user .ava2 { background: #2563eb; color: #fff; }
    .bubble { max-width: 76%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .msg.bot .bubble { background: #f4f6fa; }
    .msg.user .bubble { background: #2563eb; color: #fff; }
    .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: #9db2d8; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s } .typing span:nth-child(3) { animation-delay: .4s }
    @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
    .quick-qs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 18px; }
    .quick-q { border: 1px solid #c7d7f5; color: #2563eb; background: #f4f8ff; padding: 6px 14px; border-radius: 16px; font-size: 13px; cursor: pointer; }
    .quick-q:hover { background: #e8f0fe; }
    .input-bar { border-top: 1px solid #e5e9f2; padding: 14px 16px; }
    .input-box { display: flex; gap: 10px; }
    .input-box textarea { flex: 1; resize: none; border: 1px solid #d9e0ec; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; height: 44px; }
    .input-box textarea:focus { border-color: #2563eb; }
    .send-btn { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 0 22px; font-size: 14px; cursor: pointer; }
    .send-btn:disabled { background: #9db2d8; cursor: not-allowed; }
    .brand-foot { text-align: center; font-size: 12px; color: #b0b8c7; padding: 8px 0 2px; }
    .brand-foot a { color: #2563eb; text-decoration: none; }
    .err-page { text-align: center; margin-top: 18vh; }
    .err-page .big { font-size: 56px; }
  </style>
</head>
<body>
  <div class="share-wrap">
    <div id="shareHead" class="share-head" style="display:none">
      <div class="ava">🤖</div>
      <div style="flex:1"><h1 id="agName"></h1><p id="agDesc"></p></div>
    </div>
    <div class="share-body" id="chatBox" style="display:none">
      <div class="msgs" id="msgs"></div>
      <div class="input-bar">
        <div class="input-box">
          <textarea id="chatInput" placeholder="输入消息，Enter 发送"></textarea>
          <button class="send-btn" id="sendBtn">发送 ➤</button>
        </div>
      </div>
    </div>
    <div id="errPage" class="err-page" style="display:none">
      <div class="big">🔗</div>
      <h2 id="errMsg">分享链接无效或已关闭</h2>
      <p style="color:#8a94a6">请联系分享者获取新的链接</p>
    </div>
    <div class="brand-foot">由 <a href="/">智能体平台</a> 提供服务</div>
  </div>
  <script>
    (async function () {
      const token = location.pathname.split('/').pop();
      const $ = s => document.querySelector(s);
      let info = null, sid = null, streaming = false;

      // V3.1 #12 嵌入（2026-11-03）：iframe 嵌入场景高度上报——浮窗组件（/embed/widget.js）监听
      // ap-share-height 消息自适应面板高度。仅在被嵌入（window.parent !== window）时发送，普通浏览器访问零开销。
      const reportHeight = () => {
        try {
          if (window.parent === window) return;
          window.parent.postMessage({ type: 'ap-share-height', height: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) }, '*');
        } catch (e) { /* 跨域受限时静默（高度上报是尽力而为的增强） */ }
      };
      window.addEventListener('load', reportHeight);
      setInterval(reportHeight, 1500); // 流式回复/图片加载引起的高度变化周期上报

      try {
        const r = await fetch(`/api/share/${token}/info`);
        const j = await r.json();
        if (j.code !== 0) throw new Error(j.msg || '链接无效');
        info = j.data;
      } catch (e) { $('#errPage').style.display = ''; $('#errMsg').textContent = e.message; return; }

      document.title = info.name + ' · 智能体分享';
      $('#shareHead').style.display = '';
      $('#chatBox').style.display = '';
      $('#agName').textContent = info.name + (info.source === 'dify' ? '（Dify 搭建）' : '');
      $('#agDesc').textContent = info.description || '智能体平台分享的智能体';
      // 有效期提示（借鉴 SinguX 临时会话：链接到期自动失效）
      if (info.expires_at) {
        const tip = document.createElement('div');
        tip.style.cssText = 'margin:0 auto 10px;max-width:640px;font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:6px 12px;text-align:center';
        tip.textContent = `⏳ 本分享链接有效期至 ${info.expires_at}，到期后将自动失效`;
        $('#msgs').prepend(tip);
      }

      function addMsg(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.innerHTML = `<div class="ava2">${role === 'user' ? '我' : 'AI'}</div><div class="bubble"></div>`;
        div.querySelector('.bubble').textContent = text;
        $('#msgs').appendChild(div);
        $('#msgs').scrollTop = $('#msgs').scrollHeight;
        return div.querySelector('.bubble');
      }

      // 欢迎区
      const hero = document.createElement('div');
      hero.style.cssText = 'text-align:center;margin:6vh 0 14px';
      hero.innerHTML = `<div style="font-size:40px">👋</div><h2 style="margin:8px 0 6px">${escH(info.name)}</h2><p style="color:#8a94a6;font-size:13px">${escH(info.description || '有什么可以帮您？')}</p>`;
      $('#msgs').appendChild(hero);
      if (info.opening) addMsg('bot', info.opening);
      if (info.opening_questions?.length) {
        const qs = document.createElement('div');
        qs.className = 'quick-qs';
        qs.innerHTML = info.opening_questions.map(q => `<span class="quick-q">${escH(q)}</span>`).join('');
        qs.querySelectorAll('.quick-q').forEach(el => el.onclick = () => { $('#chatInput').value = el.textContent; send(); });
        $('#msgs').appendChild(qs);
      }

      function escH(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

      async function send() {
        const ta = $('#chatInput');
        const text = ta.value.trim();
        if (!text || streaming) return;
        ta.value = '';
        streaming = true; $('#sendBtn').disabled = true;
        addMsg('user', text);
        const live = addMsg('bot', '');
        live.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
        let acc = '';
        try {
          const res = await fetch(`/api/share/${token}/chat`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sid, content: text }),
          });
          if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const parts = buf.split('\n\n');
            buf = parts.pop();
            for (const part of parts) {
              let ev = '', data = '';
              for (const line of part.split('\n')) {
                if (line.startsWith('event: ')) ev = line.slice(7).trim();
                else if (line.startsWith('data: ')) data = line.slice(6);
              }
              if (!data) continue;
              let j; try { j = JSON.parse(data); } catch { continue; }
              if (ev === 'session' && j.sid) sid = j.sid;
              else if (ev === 'delta') { acc += j.text; live.textContent = acc; $('#msgs').scrollTop = $('#msgs').scrollHeight; }
              else if (ev === 'done') { acc = j.content; live.textContent = acc; }
              else if (ev === 'blocked') { live.textContent = '⛔ ' + j.msg; }
              else if (ev === 'notice') { live.textContent = acc + '\n\n⚠ ' + j.msg; }
              else if (ev === 'error') { live.textContent = '⚠ ' + j.msg; }
            }
          }
        } catch (e) { live.textContent = '⚠ ' + e.message; }
        streaming = false; $('#sendBtn').disabled = false; $('#chatInput').focus();
      }

      $('#sendBtn').onclick = send;
      $('#chatInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    })();
  </script>
</body>
</html>
